# Builds fast-wp.zip and publishes the release when a "v*" tag is pushed.
# Tags with "-beta" or "-rc" (e.g. v0.2.0-beta.1) become pre-releases: only sites on the "Beta" channel get them.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax (7.4 and 8.3)
        run: |
          for v in 7.4 8.3; do
            docker run --rm -v "$PWD":/app -w /app php:$v-cli sh -c 'find . -name "*.php" -not -path "./tests/*" -print0 | xargs -0 -n1 php -l' || exit 1
          done

      - name: Run the tests
        run: docker run --rm -v "$PWD":/app -w /app php:8.3-cli php tests/run.php

      - name: Check the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version: *$TAG$" fast-wp.php || { echo "The version in fast-wp.php does not match tag $TAG"; exit 1; }
          grep -q "'FAST_WP_VERSION', '$TAG'" fast-wp.php || { echo "FAST_WP_VERSION does not match tag $TAG"; exit 1; }

      - name: Build the zip
        run: |
          mkdir -p build/fast-wp
          rsync -a --exclude-from=.distignore ./ build/fast-wp/
          cd build && zip -qr fast-wp.zip fast-wp

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/fast-wp.zip
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
